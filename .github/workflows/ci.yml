name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck simple-interest.sh tests/*.sh
      - name: Run tests
        run: bash tests/test-simple-interest.sh
